name: CI

# The deploy workflow gates main, which is the publish trigger. This one gates
# everything before it, so a page describing unbuilt software fails on the branch
# rather than at the moment it would go live.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout operator chart contract
        uses: actions/checkout@v4
        with:
          repository: kubenesthq/operator-v2
          ref: argo-cd
          path: .operator-v2

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Render published operator values
        run: >-
          python3 .operator-v2/scripts/check_docs_helm_values.py
          --docs-root .
          --chart .operator-v2/charts/kubenest-operator

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publication boundary
        run: bun run check:status

      - name: Typecheck
        run: bun run typecheck

      - name: Build static export
        run: bun run build
