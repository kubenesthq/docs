name: CI

# The deploy workflow gates main, which is the publish trigger. This one gates
# everything before it, so a page describing unbuilt software fails on the branch
# rather than at the moment it would go live.
on:
  # A holding branch is legitimate, but invisible content drift is not. This
  # report never blocks a build; it makes unpublished docs paths observable.
  schedule:
    - cron: "17 08 * * *"
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fetch both refs explicitly. A scheduled run uses main's workflow file,
      # which means it can report holding-branch drift even if the holding
      # branch itself has not received this workflow revision.
      - name: Fetch published and holding docs refs
        run: >-
          git fetch --no-tags origin
          +refs/heads/main:refs/remotes/origin/main
          +refs/heads/docs/platform-public:refs/remotes/origin/docs/platform-public

      - name: Report unpublished holding-branch content drift
        run: python3 scripts/report_holding_branch_content_drift.py

      # kubenesthq/operator-v2 is private and the default GITHUB_TOKEN cannot read it, so
      # this step fails on every run until a PAT with read access is added as
      # OPERATOR_REPO_TOKEN. It is allowed to fail rather than blocking the whole check:
      # a guard that is always red teaches people to ignore red. The render step below
      # skips when the chart is absent and runs for real once the token exists.
      - name: Checkout operator chart contract
        id: operator_chart
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: kubenesthq/operator-v2
          ref: argo-cd
          path: .operator-v2
          token: ${{ secrets.OPERATOR_REPO_TOKEN || github.token }}

      # The content half needs nothing but this repo, so it runs unconditionally.
      # Proves the guard CAN FAIL before trusting it to say nothing is wrong.
      # Its failure mode is entirely in the green path: a broken pattern makes
      # it print "clean" forever and nothing downstream notices, because a red
      # result gets investigated and a green one does not. Depends on this
      # repository only, so it is safe to gate the publish on.
      - name: Retired-claim guard SELF-TEST (can it still fail?)
        run: python3 scripts/selftest_retired_claims.py

      - name: Retired-claim guard (content)
        run: python3 scripts/check_retired_claims.py --content content/

      # Until the release that supports a command ships, a page that shows it must
      # wrap it in a "Not supported by the current release." callout (README,
      # "One dated exception, 2026-09-25"; G0.6). The self-test runs first for the
      # same reason as the guard above: a stale list would otherwise print clean.
      - name: Unsupported-callout guard SELF-TEST (can it still fail?)
        run: python3 scripts/selftest_unsupported_callouts.py

      - name: Unsupported-callout guard (content)
        run: python3 scripts/check_unsupported_callouts.py

      # Every runnable example is compared against the CLI's OWN command tree
      # (PLAN section 8, G0.7): the command paths, the flags on each path, and
      # whether a path is available or a registered stub -- not a second
      # hand-written list. The tree comes from kubenest-cli's
      # cmd/gen-command-metadata, which .github/workflows/build.yml attaches to
      # every release as command-metadata.json.
      #
      # The SELF-TEST runs first, for the same reason as the guards above: a
      # metadata file that no longer says what the pages assume would otherwise
      # print clean. The check reads the COMMITTED copy, so this job needs a
      # download only for the release half below.
      - name: CLI-example guard SELF-TEST (can it still fail?)
        run: python3 scripts/selftest_cli_examples.py

      - name: CLI-example guard (content)
        run: >-
          python3 scripts/check_examples_against_cli.py
          --metadata cli-metadata/command-metadata.json
          --content content/

      # The public site documents the RELEASED CLI, so the release asset
      # cli-contract.json names is fetched and the same pages are checked
      # against it (PLAN section 7.12). This step may fail with a warning -- a
      # release cut before the asset existed has none -- but the CHECK below is
      # never a warning: a page telling a reader to run something the released
      # CLI does not have is the defect, and it stops the branch.
      - name: Fetch the released CLI's command metadata
        id: cli_release
        continue-on-error: true
        run: |
          release=$(jq -r '.public_site.release' cli-contract.json)
          repo=$(jq -r '.public_site.repo' cli-contract.json)
          asset=$(jq -r '.public_site.asset' cli-contract.json)
          curl -fsSL -o /tmp/released-command-metadata.json \
            "https://github.com/${repo}/releases/download/${release}/${asset}"

      - name: CLI-example guard (the released CLI's metadata, content)
        if: steps.cli_release.outcome == 'success'
        run: >-
          python3 scripts/check_examples_against_cli.py
          --metadata /tmp/released-command-metadata.json
          --content content/

      - name: Note when the released metadata could not be fetched
        if: steps.cli_release.outcome != 'success'
        run: |
          echo "::warning title=Released CLI metadata not fetched::The pages were checked against the committed cli-metadata/command-metadata.json only. Add the command-metadata.json release asset (kubenest-cli's build.yml produces it) or correct cli-contract.json's public_site.release."

      # The EVIDENCE half ties each still-true claim to the code that keeps it true
      # -- "the control plane builds no Kubernetes client for your cluster" is true
      # only while the client builders stay deleted. kubenesthq/kubenest-backend is
      # private, so this follows the same rule as the Helm guard above: allowed to
      # skip with a warning rather than being permanently red, because a guard that
      # is always red teaches people to ignore red.
      - name: Checkout backend for claim evidence
        id: backend_repo
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: kubenesthq/kubenest-backend
          path: .kubenest-backend
          token: ${{ secrets.OPERATOR_REPO_TOKEN || github.token }}

      - name: Retired-claim guard (code evidence)
        if: steps.backend_repo.outcome == 'success'
        run: >-
          python3 scripts/check_retired_claims.py
          --content content/ --evidence-root .kubenest-backend

      - name: Note when the claim-evidence guard was skipped
        if: steps.backend_repo.outcome != 'success'
        run: |
          echo "::warning title=Claim-evidence guard skipped::Could not read kubenesthq/kubenest-backend." \
               "Doc claims tied to code (scripts/retired-claims.json 'evidence') were NOT verified."

      - name: Install Helm
        if: steps.operator_chart.outcome == 'success'
        uses: azure/setup-helm@v4

      - name: Render published operator values
        if: steps.operator_chart.outcome == 'success'
        run: >-
          python3 .operator-v2/scripts/check_docs_helm_values.py
          --docs-root .
          --chart .operator-v2/charts/kubenest-operator

      - name: Note when the drift guard was skipped
        if: steps.operator_chart.outcome != 'success'
        run: |
          echo "::warning title=Helm values drift guard skipped::Could not read kubenesthq/operator-v2." \
               "Add a PAT with read access as the OPERATOR_REPO_TOKEN secret to enable it (kn-lx5t)."

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile


      - name: Typecheck
        run: bun run typecheck

      - name: Build static export
        run: bun run build
