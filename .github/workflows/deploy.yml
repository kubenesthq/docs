name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two publishes at once; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Helm-values drift guard deliberately does NOT run here. It needs to clone
      # kubenesthq/operator-v2, which the default GITHUB_TOKEN cannot read, so it failed
      # closed and blocked publishing entirely (run 32578834006). Publishing must depend
      # only on this repository. The guard belongs in CI, where it runs on every push to
      # this branch and can fail loudly without taking the site down with it.

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publication boundary
        run: bun run check:status

      - name: Typecheck
        run: bun run typecheck

      - name: Build static export
        run: bun run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
