name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two publishes at once; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout operator chart contract
        uses: actions/checkout@v4
        with:
          repository: kubenesthq/operator-v2
          ref: argo-cd
          path: .operator-v2

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Render published operator values
        run: >-
          python3 .operator-v2/scripts/check_docs_helm_values.py
          --docs-root .
          --chart .operator-v2/charts/kubenest-operator

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publication boundary
        run: bun run check:status

      - name: Typecheck
        run: bun run typecheck

      - name: Build static export
        run: bun run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
