name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two publishes at once; let a newer push finish rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Helm-values drift guard deliberately does NOT run here. It needs to clone
      # kubenesthq/operator-v2, which the default GITHUB_TOKEN cannot read, so it failed
      # closed and blocked publishing entirely (run 32578834006). Publishing must depend
      # only on this repository. The guard belongs in CI, where it runs on every push to
      # this branch and can fail loudly without taking the site down with it.

      # Depends on THIS REPOSITORY ONLY, which is why it may gate the publish. The
      # registry and its patterns are in-repo; the cross-repo evidence checks live
      # in ci.yml, for the reason written above. A retired security claim must not
      # be able to reach the served page, so this runs before the build (kn-mxxu).
      # Proves the guard CAN FAIL before trusting it to say nothing is wrong.
      # Its failure mode is entirely in the green path: a broken pattern makes
      # it print "clean" forever and nothing downstream notices, because a red
      # result gets investigated and a green one does not. Depends on this
      # repository only, so it is safe to gate the publish on.
      # --publish-gate: refuses a publish only when the GUARD HAS STOPPED WORKING.
      # Incomplete fixture coverage is reported and does not block, because it is
      # pre-existing debt that this publish did not cause and the guard still fires
      # for every claim that has a fixture. CI enforces coverage on the change.
      - name: Retired-claim guard SELF-TEST (has it stopped working?)
        run: python3 scripts/selftest_retired_claims.py --publish-gate

      - name: Retired-claim guard (content)
        run: python3 scripts/check_retired_claims.py --content content/

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile


      - name: Typecheck
        run: bun run typecheck

      - name: Build static export
        run: bun run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # PUBLISHED IS NOT MERGED. The content gate above proves the branch is clean; it
  # cannot prove the site serves that branch. A stale build, a partial deploy or a
  # cached page all look identical to success from inside the repo, and this wave
  # re-invented the "check the served page, not the branch" rule three times
  # (kn-okb6). So the last word belongs to the live URL.
  verify-served:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retired-claim guard (served page)
        run: |
          python3 scripts/check_retired_claims.py \
            --served https://docs.kubenest.io/ https://docs.kubenest.io/architecture/
